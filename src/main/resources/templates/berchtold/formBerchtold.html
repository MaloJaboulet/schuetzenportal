<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daten Eingabe</title>
</head>
<body>
<div th:fragment="content">
    <div class="form-container">
        <h2><i class="fas fa-user-plus"></i> Schützen Daten Eingabe</h2>

        <div class="alert alert-success alert-dismissible fade show" th:if="${success}" role="alert">
            <i class="fas fa-check-circle"></i> Daten erfolgreich gespeichert!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" role="alert">
            <i class="fas fa-exclamation-circle"></i> Fehler beim Speichern der Daten!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/berchtold/save}" method="post" th:object="${competitorDTO}" class="needs-validation" novalidate>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label"><i class="fas fa-user"></i> Name*</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required
                           placeholder="Nachname eingeben">
                    <div class="invalid-feedback">Bitte geben Sie einen Namen ein.</div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="vorname" class="form-label"><i class="fas fa-user"></i> Vorname*</label>
                    <input type="text" class="form-control" id="vorname" th:field="*{vorname}" required
                           placeholder="Vorname eingeben">
                    <div class="invalid-feedback">Bitte geben Sie einen Vornamen ein.</div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="jahrgang" class="form-label"><i class="fas fa-calendar-alt"></i> Jahrgang*</label>
                    <input type="number" class="form-control" id="jahrgang" name="jahrgang" required min="1900"
                           max="2025" placeholder="z.B. 1985">
                    <div class="invalid-feedback">Bitte geben Sie einen gültigen Jahrgang ein (1900-2025).</div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="lizenzNummer" class="form-label"><i class="fas fa-calendar-alt"></i> Lizenznummer</label>
                    <input type="number" class="form-control" id="lizenzNummer" name="lizenzNummer" placeholder="Lizenznummer eingeben" min="0" max="999999">
                    <div class="invalid-feedback">Bitte geben Sie eine Lizenznummer ein (0-999999).</div>
                </div>

            </div>

            <div class="row mb-3 align-items-center">
                <div class="col-md-6">
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input me-2" id="gast" th:field="*{guest}" type="checkbox">
                        <label for="gast" class="form-check-label mb-0"><i class="fas fa-users"></i> Gast?</label>
                    </div>
                </div>
            </div>



            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="reset" class="btn btn-secondary me-md-2">
                    <i class="fas fa-undo"></i> Zurücksetzen
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Speichern
                </button>
            </div>
        </form>
    </div>

    <!-- Form validation script -->
    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (function () {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            var forms = document.querySelectorAll('.needs-validation')

            // Loop over them and prevent submission
            Array.prototype.slice.call(forms)
                .forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }

                        form.classList.add('was-validated')
                    }, false)
                })
        })()

        // Category change event listener - this goes in your existing JavaScript section
        document.getElementById('kategorie').addEventListener('change', function() {
            const selectedCategory = this.value;
            const shotCard = document.getElementById('shotCard');
            const container = document.getElementById('shotInputContainer');

            if (!selectedCategory) {
                shotCard.style.display = 'none';
                return;
            }

            // Show the card
            shotCard.style.display = 'block';

            // Clear existing content
            container.innerHTML = '';

            // Generate form inputs based on category
            let html = '<div class="row">';

            if (selectedCategory === 'G300A') {
                html += generateG300AInputs();
            } else if (selectedCategory === 'G300B') {
                html += generateG300BInputs();
            } else if (selectedCategory === 'P25' || selectedCategory === 'P50') {
                html += generateP2550Inputs();
            }

            html += '</div>';
            container.innerHTML = html;

            // Re-apply form validation
            applyValidationToNewInputs();
        });

        function generateG300AInputs() {
            const configs = [
                { label: 'Passe 1', min: 0, max: 100, placeholder: '0-100' },
                { label: 'Passe 2', min: 0, max: 100, placeholder: '0-100' },
                { label: 'Passe 3', min: 0, max: 20, placeholder: '0-20' },
                { label: 'Passe 4', min: 0, max: 30, placeholder: '0-30' },
                { label: 'Passe 5', min: 0, max: 60, placeholder: '0-60' }
            ];

            return generateColumnLayout(configs, 'col-md-4', 2);
        }

        function generateG300BInputs() {
            const configs = [
                { label: 'Passe 1', min: 0, max: 100, placeholder: '0-100' },
                { label: 'Passe 2', min: 0, max: 50, placeholder: '0-50' },
                { label: 'Passe 3', min: 0, max: 20, placeholder: '0-20' },
                { label: 'Passe 4', min: 0, max: 30, placeholder: '0-30' },
                { label: 'Passe 5', min: 0, max: 60, placeholder: '0-60' }
            ];

            return generateColumnLayout(configs, 'col-md-4', 2);
        }

        function generateP2550Inputs() {
            const configs = Array.from({length: 6}, (_, i) => ({
                label: `Passe ${i + 1}`,
                min: 0,
                max: 50,
                placeholder: '0-50'
            }));

            return generateColumnLayout(configs, 'col-md-6', 3);
        }

        function generateColumnLayout(configs, colClass, itemsPerColumn) {
            let html = '';
            const numColumns = Math.ceil(configs.length / itemsPerColumn);

            for (let col = 0; col < numColumns; col++) {
                html += `<div class="${colClass}">`;

                for (let i = col * itemsPerColumn; i < Math.min((col + 1) * itemsPerColumn, configs.length); i++) {
                    const config = configs[i];
                    html += `
                <div class="mb-3">
                    <label for="schuss${i}" class="form-label">${config.label}</label>
                    <input type="number" class="form-control" id="schuss${i}"
                           name="schussListe[${i}]" min="${config.min}" max="${config.max}"
                           required placeholder="${config.placeholder}">
                    <div class="invalid-feedback">Bitte geben Sie einen Wert zwischen ${config.min} und ${config.max} ein.</div>
                </div>`;
                }

                html += '</div>';
            }

            return html;
        }

        function applyValidationToNewInputs() {
            const form = document.getElementById('qualificationForm') || document.querySelector('form');
            const inputs = form.querySelectorAll('input[type="number"]:not([data-validated])');

            inputs.forEach(input => {
                input.setAttribute('data-validated', 'true');
                input.addEventListener('input', function() {
                    if (this.checkValidity()) {
                        this.classList.remove('is-invalid');
                        this.classList.add('is-valid');
                    } else {
                        this.classList.remove('is-valid');
                        this.classList.add('is-invalid');
                    }
                });
            });
        }
    </script>
</div>
</body>
</html>
